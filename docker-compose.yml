version: '3.8'

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rag-net

  api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-7}
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge

volumes:
  postgres-data:
