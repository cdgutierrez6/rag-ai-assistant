[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage thresholds — SonarQube High Gate
addopts =
    --cov=app
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-fail-under=80
    -v

# Sonar integration
log_cli = true
log_cli_level = INFO
